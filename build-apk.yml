name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install & build web
        run: |
          npm ci
          VITE_BASE=./ VITE_API_URL="${{ vars.VITE_API_URL }}" npm run build

      - name: Add Android platform & sync
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/areese.jks
            echo "PASS=$KEYSTORE_PASS" >> $GITHUB_ENV
            echo "Using keystore from secrets"
          else
            keytool -genkeypair -v -keystore android/areese.jks -alias areese -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass areese123 -keypass areese123 -dname "CN=AREESE Marks, O=AREESE Gurukulam, L=Jaipur, C=IN"
            echo "PASS=areese123" >> $GITHUB_ENV
            echo "NEW_KEYSTORE=1" >> $GITHUB_ENV
            echo "::warning::No KEYSTORE_B64 secret — a new keystore was generated. Download the 'keystore-SAVE-THIS' artifact and add it as a secret, or future APKs won't install over this one."
          fi

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/areese.jks \
            -Pandroid.injected.signing.store.password=$PASS \
            -Pandroid.injected.signing.key.alias=areese \
            -Pandroid.injected.signing.key.password=$PASS
          cp app/build/outputs/apk/release/app-release.apk ../AREESE-Marks.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AREESE-Marks-apk
          path: AREESE-Marks.apk

      - name: Upload new keystore (first run only)
        if: env.NEW_KEYSTORE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-SAVE-THIS
          path: android/areese.jks

      - name: Attach APK to release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AREESE-Marks.apk
